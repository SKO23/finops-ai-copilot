name: Sync FinOps App to Hugging Face

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "Dockerfile"
      - "requirements.txt"

  workflow_dispatch:

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Upload app.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload SumitKohli/finops-ai-copilot app.py app.py \
            --repo-type space \
            --token "$HF_TOKEN" \
            --commit-message "Sync app.py from GitHub"

      - name: Upload Dockerfile
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload SumitKohli/finops-ai-copilot Dockerfile Dockerfile \
            --repo-type space \
            --token "$HF_TOKEN" \
            --commit-message "Sync Dockerfile from GitHub"

      - name: Upload requirements.txt
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload SumitKohli/finops-ai-copilot requirements.txt requirements.txt \
            --repo-type space \
            --token "$HF_TOKEN" \
            --commit-message "Sync requirements.txt from GitHub"
